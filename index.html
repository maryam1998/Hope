<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1C2541" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="کتاب مکالمه" />
<title>LingoLearn</title>

<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- فونت‌ها غیرمسدودکننده‌اند: بدون اینترنت یا با اینترنتِ کند، اپ منتظرشان نمی‌ماند و با فونتِ سیستم بالا می‌آید. -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<!-- استایل‌های Tailwind که اپ استفاده می‌کند، به‌صورتِ فایلِ محلی (قبلاً از cdn.tailwindcss.com می‌آمد و بدونِ اینترنت اپ بالا نمی‌آمد). -->
<link rel="stylesheet" href="tailwind.css" />

<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; }
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  #splash {
    position: fixed; inset: 0; background: #F1E8D6; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Vazirmatn', sans-serif; color: #1C2541; font-size: 15px;
  }
</style>

<!-- کتابخانه‌ها (React، lucide، supabase) داخلِ خودِ app.bundle.min.js هستند؛ دیگر importmap و CDN لازم نیست، پس اپ آفلاین هم بالا می‌آید. -->
</head>
<body>
  <div id="root"><div id="splash">در حال بارگذاری…</div></div>

  <!-- Error overlay: shows uncaught errors directly on the page. -->
  <script>
    function showErr(msg) {
      var el = document.getElementById("splash");
      if (!el) { el = document.createElement("div"); el.id = "splash"; document.body.prepend(el); }
      el.style.cssText = "position:fixed;inset:0;background:#F1E8D6;z-index:9999;display:block;padding:16px;font-family:monospace;color:#b00020;font-size:13px;white-space:pre-wrap;overflow:auto;direction:ltr;text-align:left;";
      el.textContent = "خطا:\n" + msg;
    }
    window.addEventListener("error", function (e) {
      showErr((e.message || "") + "\n" + (e.filename || "") + ":" + (e.lineno || "") + ":" + (e.colno || "") + "\n" + (e.error && e.error.stack ? e.error.stack : ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      showErr("Promise rejection: " + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
    });
  </script>

  <!-- Pre-bundled app: everything (app.jsx + all data files + DailyConversationsTab)
       compiled ahead of time with esbuild, so no in-browser Babel/JSX transform
       and no relative-import resolution needed at runtime. -->
  <script type="module" src="app.bundle.min.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!window.__swReloaded) {
          window.__swReloaded = true;
          window.location.reload();
        }
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
      });
    }
  </script>
</body>
</html>
