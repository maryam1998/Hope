<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1C2541" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="کتاب مکالمه" />
<title>کتاب مکالمه — Phrasebook</title>

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; }
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  #splash {
    position: fixed; inset: 0; background: #F1E8D6; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Vazirmatn', sans-serif; color: #1C2541; font-size: 15px;
  }
</style>

<!-- Import map: only the CDN packages the bundle imports as bare specifiers. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.0",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@4.0.379"
  }
}
</script>

<!-- Tailwind utility classes used throughout the bundled app. -->
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"><div id="splash">در حال بارگذاری…</div></div>

  <!-- Error overlay: shows uncaught errors directly on the page. -->
  <script>
    function showErr(msg) {
      var el = document.getElementById("splash");
      if (!el) { el = document.createElement("div"); el.id = "splash"; document.body.prepend(el); }
      el.style.cssText = "position:fixed;inset:0;background:#F1E8D6;z-index:9999;display:block;padding:16px;font-family:monospace;color:#b00020;font-size:13px;white-space:pre-wrap;overflow:auto;direction:ltr;text-align:left;";
      el.textContent = "خطا:\n" + msg;
    }
    window.addEventListener("error", function (e) {
      showErr((e.message || "") + "\n" + (e.filename || "") + ":" + (e.lineno || "") + ":" + (e.colno || "") + "\n" + (e.error && e.error.stack ? e.error.stack : ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      showErr("Promise rejection: " + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
    });
  </script>

  <!-- Pre-bundled app: everything (app.jsx + all data files + DailyConversationsTab)
       compiled ahead of time with esbuild, so no in-browser Babel/JSX transform
       and no relative-import resolution needed at runtime. -->
  <!-- نکته: اسمِ فایل باید دقیقاً با خروجیِ دستورِ esbuild یکی باشه
       (--outfile=app_bundle_min.js → یعنی با آندرلاین، نه نقطه). قبلاً اینجا
       "app.bundle.min.js" (با نقطه) نوشته شده بود که با فایلِ واقعی مچ نمی‌شد
       → ۴۰۴ خاموش → صفحه برای همیشه رو «در حال بارگذاری...» می‌موند، چون
       window.onerror شکستِ بارگذاریِ خودِ اسکریپت رو نمی‌گیره (فقط خطاهای
       اجرا رو می‌گیره). onerror زیر مستقیماً روی خودِ تگ اضافه شده تا این‌جور
       مشکلات دیگه خاموش نمونن. -->
  <script
    type="module"
    src="app_bundle_min.js"
    onerror="showErr('باندل بارگذاری نشد (احتمالاً اسمِ فایل درست نیست یا فایل روی سرور موجود نیست): app_bundle_min.js')"
  ></script>

  <!-- واچ‌داگ: اگه ۸ ثانیه گذشت و بازم اسپلش سرِ جاشه (نه خطا نشون داده شده،
       نه اپ بالا اومده)، یعنی یه جای دیگه گیر کرده — پیام روشن‌تری به‌جای
       «در حال بارگذاری...» ابدی نشون می‌ده. -->
  <script>
    setTimeout(function () {
      var el = document.getElementById("splash");
      if (el && document.body.contains(el)) {
        showErr("بارگذاریِ اپ بیش از حدِ معمول طول کشید. ممکنه فایلِ باندل (app_bundle_min.js) پیدا نشده باشه، یا یکی از importmap/فونت‌ها/سرویس‌ورکر گیر کرده باشه. کنسولِ مرورگر رو هم چک کن.");
      }
    }, 8000);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!window.__swReloaded) {
          window.__swReloaded = true;
          window.location.reload();
        }
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
