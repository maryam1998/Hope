<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1C2541" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="کتاب مکالمه" />
<title>کتاب مکالمه — Phrasebook (debug)</title>

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; }
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  #splash {
    position: fixed; inset: 0; background: #F1E8D6; z-index: 9999;
    padding: 16px; font-family: monospace; color: #1C2541; font-size: 13px;
    white-space: pre-wrap; overflow: auto; direction: ltr; text-align: left;
  }
  #splash .err { color: #b00020; font-weight: bold; }
  #splash .ok { color: #1a7f37; }
</style>
</head>
<body>
  <div id="root"><div id="splash">شروع لاگ...\n</div></div>

  <script>
    var t0 = Date.now();
    function log(msg, cls) {
      var el = document.getElementById("splash");
      var line = document.createElement("div");
      if (cls) line.className = cls;
      line.textContent = "[" + (Date.now() - t0) + "ms] " + msg;
      el.appendChild(line);
    }
    log("HTML شروع شد");

    window.addEventListener("error", function (e) {
      log("خطای سراسری: " + (e.message || "") + " @ " + (e.filename || "") + ":" + (e.lineno || "") + ":" + (e.colno || "") + "\n" + (e.error && e.error.stack ? e.error.stack : ""), "err");
    });
    window.addEventListener("unhandledrejection", function (e) {
      log("Promise rejection: " + (e.reason && e.reason.stack ? e.reason.stack : e.reason), "err");
    });

    function loadScript(src, label) {
      return new Promise(function (resolve, reject) {
        log("شروع لود: " + label + " (" + src + ")");
        var s = document.createElement("script");
        s.src = src;
        s.onload = function () { log("لود شد: " + label, "ok"); resolve(); };
        s.onerror = function () { log("خطا در لود: " + label, "err"); reject(new Error("failed to load " + src)); };
        document.head.appendChild(s);
      });
    }

    // importmap must be added as a real tag, not fetched dynamically
    var im = document.createElement("script");
    im.type = "importmap";
    im.textContent = JSON.stringify({
      imports: {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.0"
      }
    });
    document.head.appendChild(im);
    log("importmap اضافه شد");

    loadScript("https://cdn.tailwindcss.com", "Tailwind")
      .then(function () { return loadScript("https://unpkg.com/@babel/standalone@7.24.7/babel.min.js", "Babel"); })
      .then(function () {
        log("در حال fetch کردن app.jsx ...");
        return fetch("app.jsx");
      })
      .then(function (res) {
        log("app.jsx دریافت شد، status=" + res.status);
        return res.text();
      })
      .then(function (code) {
        log("طول فایل app.jsx: " + code.length + " کاراکتر. شروع transform با Babel...");
        var out;
        try {
          out = Babel.transform(code, { presets: ["react"], filename: "app.jsx", sourceType: "module" }).code;
        } catch (transformErr) {
          log("خطای Babel transform: " + transformErr.message, "err");
          throw transformErr;
        }
        log("Babel transform تموم شد. طول خروجی: " + out.length, "ok");
        log("در حال اجرای کد به‌عنوان ماژول...");
        var blob = new Blob([out], { type: "text/javascript" });
        var url = URL.createObjectURL(blob);
        var s = document.createElement("script");
        s.type = "module";
        s.src = url;
        s.onload = function () { log("app.jsx اجرا شد (module loaded)", "ok"); };
        s.onerror = function (ev) { log("خطا در اجرای ماژول (جزئیات ممکنه opaque باشه)", "err"); };
        document.head.appendChild(s);
      })
      .catch(function (err) {
        log("خطای کلی در زنجیره‌ی لود: " + (err && err.message ? err.message : err), "err");
      });
  </script>
</body>
</html>
