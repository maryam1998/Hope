<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1C2541" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="کتاب مکالمه" />
<title>کتاب مکالمه — Phrasebook</title>

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; }
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  #splash {
    position: fixed; inset: 0; background: #F1E8D6; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Vazirmatn', sans-serif; color: #1C2541; font-size: 15px;
  }
</style>

<!-- Import map: lets the plain `import X from "react"` style statements
     already in app.jsx resolve to real packages straight from a CDN, with
     no bundler / build step required. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.0"
  }
}
</script>

<!-- Tailwind utility classes (flex, flex-wrap, gap-2, etc.) are used all over
     app.jsx. Claude's artifact PREVIEW injects Tailwind automatically, which is
     why the app looked right there — but a real deployed site (GitHub Pages,
     Netlify, ...) has no CSS for those classes unless we load it ourselves. -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- In-browser JSX/ESM transform (no build step needed) -->
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
  <div id="root"><div id="splash">در حال بارگذاری…</div></div>

  <!-- Error overlay: اگه اسکریپت خطا بده، به‌جای صفحه‌ی سفید/بارگذاری،
       خودِ متن خطا رو مستقیم روی صفحه نشون می‌ده تا بدون نیاز به
       Console گوشی، بشه ارور رو دید. -->
  <script>
    function showErr(msg) {
      var el = document.getElementById("splash");
      if (!el) { el = document.createElement("div"); el.id = "splash"; document.body.prepend(el); }
      el.style.cssText = "position:fixed;inset:0;background:#F1E8D6;z-index:9999;display:block;padding:16px;font-family:monospace;color:#b00020;font-size:13px;white-space:pre-wrap;overflow:auto;direction:ltr;text-align:left;";
      el.textContent = "خطا:\n" + msg;
    }
    window.addEventListener("error", function (e) {
      showErr((e.message || "") + "\n" + (e.filename || "") + ":" + (e.lineno || "") + ":" + (e.colno || "") + "\n" + (e.error && e.error.stack ? e.error.stack : ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      showErr("Promise rejection: " + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
    });
  </script>

  <script type="text/babel" data-type="module" data-presets="react" src="app.jsx"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
