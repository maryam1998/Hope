# این ورک‌فلو به‌صورتِ خودکار، هر بار که یکی از فایل‌های سورس (app.jsx،
# RangeSliderFilter.jsx، DailyConversationsTab.jsx، یا هر کدوم از فایل‌های
# داده مثل SLANG_WORDS.js یا LINGOVA_CHARACTERS.js) عوض بشه و push بشه، دوباره app.bundle.min.js رو
# با esbuild می‌سازه و همون فایلِ ساخته‌شده رو خودش commit می‌کنه. یعنی از
# این به بعد فقط کافیه فایلِ سورس رو ویرایش و push کنی — دیگه لازم نیست
# خودت (یا من) دستی باندل رو بسازی و آپلود کنی.
#
# نصب: این فایل رو دقیقاً تو مسیرِ .github/workflows/build-bundle.yml تو
# ریشه‌ی ریپازیتوری بذار (پوشه‌ی .github باید کنارِ app.jsx باشه).

name: Build app bundle

on:
  push:
    branches: [main]
    paths:
      - "app.jsx"
      - "RangeSliderFilter.jsx"
      - "DailyConversationsTab.jsx"
      - "VOCAB.js"
      - "WORDS_AZ.js"
      - "NEWS_WORDS.js"
      - "DAILY_WORDS.js"
      - "SLANG_WORDS.js"
      - "DAILY_CONVERSATIONS.js"
      - "vocabularyInUseData.js"
      - "LINGOVA_CHARACTERS.js"
  workflow_dispatch: {}

# لازمه ورک‌فلو اجازه‌ی commit/push به همین ریپو رو داشته باشه.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with esbuild (no network deps other than npm)
        run: |
          npx --yes esbuild@0.27.7 app.jsx \
            --bundle \
            --minify \
            --format=esm \
            --target=es2020 \
            --loader:.js=jsx \
            --external:react \
            --external:react-dom \
            --external:react-dom/client \
            --external:lucide-react \
            --external:@supabase/supabase-js \
            --external:firebase/app \
            --external:firebase/auth \
            --external:firebase/firestore \
            --external:pdfjs-dist \
            --external:pdf-lib \
            --outfile=app.bundle.min.js

      # هر بار که باندل عوض بشه، مرورگرهایی که sw.js رو قبلاً نصب کردن باید
      # نسخه‌ی جدید رو تشخیص بدن — برای همین شماره‌نسخه‌ی CACHE_VERSION تو
      # sw.js رو خودکار یکی زیاد می‌کنیم (اگه فایل sw.js تو ریشه‌ی ریپو
      # باشه). اگه اسم/مسیرش فرق داره، این قسمت رو حذف کن یا مسیر رو
      # اصلاح کن.
      - name: Bump service-worker cache version
        run: |
          if [ -f sw.js ]; then
            node -e '
              const fs = require("fs");
              const path = "sw.js";
              let s = fs.readFileSync(path, "utf-8");
              s = s.replace(/CACHE_VERSION\s*=\s*"v(\d+)"/, (m, n) => `CACHE_VERSION = "v${Number(n) + 1}"`);
              fs.writeFileSync(path, s, "utf-8");
            '
          fi

      - name: Commit updated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.bundle.min.js sw.js
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: rebuild app.bundle.min.js [auto]"
          git push
